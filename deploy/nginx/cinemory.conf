# CineMory — Nginx 리버스 프록시 (deploy-spec 2-6)
# 설치 위치: /etc/nginx/sites-available/cinemory  → sites-enabled에 심볼릭 링크
# ⚠️ 설치 전 example.com 을 실제 도메인으로 모두 바꾼다:  sudo sed -i 's/example\.com/<도메인>/g' /etc/nginx/sites-available/cinemory
# ⚠️ 인증서가 먼저 있어야 nginx -t 를 통과한다 — 발급 순서는 deploy-spec 2-6.
# 반영: sudo nginx -t && sudo systemctl reload nginx

# ── 인증 엔드포인트 요청 제한 (deploy-spec 12절 L-1) ────────────────────────────
# IP당 제한. 발표장처럼 여러 기기가 같은 Wi-Fi(같은 공인 IP)를 쓰는 경우를 고려해 burst를 넉넉히 둔다.
limit_req_zone $binary_remote_addr zone=cinemory_auth:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=cinemory_reset:10m rate=5r/m;

# ── 80: ACME 챌린지만 받고 나머지는 HTTPS로 ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # certbot webroot — 최초 발급과 갱신이 같은 경로를 쓴다(2-6).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443: 앱으로 프록시 ──────────────────────────────────────────────────────────
server {
    # Ubuntu 24.04 기본 nginx는 1.24 — `http2 on;`(1.25.1+)이 아니라 listen 파라미터로 켠다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 현재 업로드 API 없음. 프로필 사진(2-8)·theater 멀티파트(C-2) 착수 시 늘린다.
    client_max_body_size 1m;

    # 앱이 프록시 뒤에서 스킴·클라이언트 IP를 알 수 있게(1-3 forward-headers-strategy: native).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # 관리자 시드·resync는 limit 분할 전제로 120s 안에 끝낸다.
    proxy_read_timeout 120s;

    limit_req_status 429;

    # 로그인·소셜 로그인·토큰 재발급·가입
    location ~ ^/api/auth/(login|signup|reissue|oauth/[^/]+)$ {
        limit_req zone=cinemory_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # 비밀번호 재설정 — 메일 발송·코드 확인이라 더 엄격하게
    location ^~ /api/auth/password-reset/ {
        limit_req zone=cinemory_reset burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
