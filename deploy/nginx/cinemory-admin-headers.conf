# CineMory 관리자 웹 보안 헤더 (admin-spec 6-6)
# 설치 위치: /etc/nginx/snippets/cinemory-admin-headers.conf
# ⚠️ Nginx는 하위 location에 add_header가 하나라도 있으면 상위 add_header를 상속하지 않는다.
#    /assets/ · / location은 Cache-Control을 넣으므로 서버 블록과 두 location 모두에서 이 파일을 include한다.
# antd는 런타임에 <style>을 넣어 style-src에 'unsafe-inline'이 필요하다.
# img-src: TMDB 포스터 + 프로필 사진(CloudFront, account-integrity Part B).
add_header X-Frame-Options        "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy        "no-referrer" always;
add_header X-Robots-Tag           "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://image.tmdb.org https://*.cloudfront.net; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
