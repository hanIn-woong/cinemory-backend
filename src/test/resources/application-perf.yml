# 부하 측정 전용 프로파일 — social-feed-spec 6절. cinemory_test는 다른 테스트가 공유하므로 대량 시드를 섞지 않는다.
# ./gradlew perfTest가 test,perf 순서로 활성화한다(test 그룹이 secret을 끌어오고, perf가 datasource.url만 덮는다).
#
# 사전 준비 — 빈 스키마 한 번 (테이블은 Flyway가 V35까지 만든다):
#   mysql -u root -p -e "CREATE DATABASE cinemory_perf CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
# 시드(docs/schema/perf/social-feed-seed.sql)는 SocialFeedPerfTest가 비어 있을 때 스스로 넣는다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cinemory_perf?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&allowMultiQueries=false
