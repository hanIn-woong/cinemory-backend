# 테스트 전용 프로파일 — @SpringBootTest가 실 개발 DB(cinemory) 대신 이 스키마를 쓰게 한다.
#
# 배경: MovieRepositoryTest가 하드코딩한 tmdbId(313369, 라라랜드)가 실제 TMDB 시드로
# cinemory DB에 이미 존재해 uk_movie_tmdb_id 유니크 제약 위반으로 실패했다. 테스트가
# 별도 프로파일 없이 application.yml의 실 DB에 그대로 접속하고 있었던 것이 근본 원인.
#
# datasource.url만 오버라이드한다 — jwt/oauth/mail 등 나머지 설정은 base application.yml +
# 프로파일 그룹(application.yml의 group.test: secret → config/application-secret.yml)에서
# 그대로 가져온다(프로파일 문서는 교체가 아니라 병합이므로 안전하다).
#
# 사전 준비 — 로컬 MySQL에 빈 cinemory_test 스키마를 한 번 만들기만 하면 된다.
#   mysql -u root -p -e "CREATE DATABASE cinemory_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
# 테이블은 Flyway가 만든다(빈 DB → V17__baseline.sql부터 실행, deploy-spec 1-4).
# 스키마 변경도 ./gradlew test 기동 시 Flyway가 반영하므로, 예전의 "델타를 양쪽 DB에 수동 적용" 규칙은 폐기됐다.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cinemory_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
