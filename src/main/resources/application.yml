

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinemory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  data:
    web:
      pageable:
        # 클라이언트가 size를 크게 넣어 벌크 IN절을 부풀리는 것을 막는다(5-0-D).
        max-page-size: 100
        # Page를 그대로 반환한 실수가 있어도 PageImpl 대신 안정된 포맷이 나가게 하는 안전망.
        # Boot 4에서는 @EnableSpringDataWebSupport를 직접 선언하지 않고 이 프로퍼티로 설정한다.
        serialization-mode: VIA_DTO

  profiles:
    include: secret

  mail:
    # username/password(Gmail 앱 비밀번호)는 application-secret.yml에 둔다
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # ⚠️ 타임아웃은 선택이 아니라 필수다 (S-9 F-2).
          # 메일 발송을 트랜잭션 안에서 하므로, SMTP가 응답하지 않으면 그동안
          # DB 커넥션이 그대로 묶인다. 상한을 두지 않으면 메일 서버 장애가
          # 커넥션 풀 고갈로 번진다.
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000


jwt:
  # secret은 application-secret.yml에 둔다 (.gitignore 대상)
  # TTL은 Duration(ISO-8601)으로 받아 오타 시 기동 시점에 실패하도록 한다
  access-token-ttl: PT30M      # 30분
  refresh-token-ttl: P14D      # 14일
  # 회전 직후 동시 재발급 요청을 재사용(탈취)으로 오판하지 않기 위한 유예 시간
  refresh-reuse-grace: PT30S


oauth:
  kakao:
    issuer: https://kauth.kakao.com
    jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
    # kid 캐시 미스 시 재조회하되 이 간격보다 자주는 하지 않는다.
    # 없으면 임의 kid 토큰을 반복 전송해 JWKS 조회를 무한 유발할 수 있고,
    # 카카오가 우리를 차단하면 소셜 로그인 전체가 죽는다.
    jwk-refresh-cooldown: PT1M
    # allowed-audiences는 application-secret.yml에 둔다 (앱 식별자라 커밋하지 않는다)

auth:
  oauth:
    # 소셜 로그인 nonce 유효 기간. 로그인 흐름(nonce 발급 → 카카오 SDK → 서버 검증)이
    # 이 안에 끝나야 한다. 짧을수록 재전송 창이 좁지만 사용자가 로그인 중 머뭇거릴 여지도 준다.
    nonce-ttl: PT5M
  password-reset:
    # 재설정 링크 유효 기간. 메일함이 털린 상황을 가정해 짧게 잡는다.
    ttl: PT30M
    # 마지막 발급 이후 이 시간 안의 재요청은 조용히 무시한다(응답은 그대로 200).
    # rate limiting이 없는 상태에서 메일 폭탄을 막는 최소 장치다 — S-9 F-1.
    resend-cooldown: PT3M


mail:
  password-reset:
    # 발신 주소. Gmail은 계정 주소와 다른 값을 넣어도 실제 발신자로 덮어쓴다.
    from: cinemory.noreply@gmail.com
    subject: "[CineMory] 비밀번호 재설정 안내"
    # 커스텀 스킴 딥링크. 웹 폴백 페이지가 없어 유니버설 링크를 쓸 수 없고,
    # 앱이 설치돼 있지 않으면 링크가 동작하지 않는다(한계로 명시).
    deep-link-base: cinemory://reset-password


# TMDB API
# access-token은 저장소에 커밋하지 않는다 — application-secret.yml에 tmdb.access-token으로 둔다.
# v4 Read Access Token(Bearer)이며 v3 api_key와 다른 값이다.
# 미설정 시 Authorization 헤더를 붙이지 않고, 기동은 막지 않는다(KOFIC과 동일 원칙).
tmdb:
  base-url: https://api.themoviedb.org/3

cinemory:
  cors:
    # RN 네이티브는 CORS와 무관하지만 Expo 웹/브라우저 테스트에는 필요하다.
    # 8081 = Metro(SDK 50+ 웹 포함), 19006 = 구버전 Expo 웹
    allowed-origins: http://localhost:8081,http://localhost:19006
  boxoffice:
    # 일별 수집: KOFIC이 전일 데이터를 익일 제공하므로 새벽 5시에 '어제' 기준으로 수집
    daily-sync-cron: "0 0 5 * * *"
    # 재매칭: 일별 수집 직후 실행
    rematch-cron: "0 30 5 * * *"
    rematch-limit: 200
  theater:
    default-radius-meters: 5000
    max-radius-meters: 50000
    max-result-size: 50