

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinemory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: root

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    # 스키마 변경은 db/migration/V{n}__*.sql(실행, 적용 후 동결) + docs/schema/v{n}-delta.sql(설계 근거) 한 쌍.
    # 적용은 앱 기동이 한다 — 수동 mysql < delta.sql 금지(flyway_schema_history와 어긋난다). deploy-spec 1-4.
    enabled: true
    baseline-on-migrate: true    # 이미 테이블이 있는 DB(cinemory·cinemory_test)는 v17로 기준점만 찍는다
    baseline-version: 17         # 빈 DB(운영 초기화·CI)는 V17__baseline.sql부터 실행된다
    # locations 기본값 classpath:db/migration

  data:
    web:
      pageable:
        # 클라이언트가 size를 크게 넣어 벌크 IN절을 부풀리는 것을 막는다(5-0-D).
        max-page-size: 100
        # Page를 그대로 반환한 실수가 있어도 PageImpl 대신 안정된 포맷이 나가게 하는 안전망.
        # Boot 4에서는 @EnableSpringDataWebSupport를 직접 선언하지 않고 이 프로퍼티로 설정한다.
        serialization-mode: VIA_DTO

  profiles:
    # include: secret을 쓰지 않는다 — include는 어느 프로파일에서든 secret을 끌어와,
    # prod를 로컬에서 검증할 때도 비밀 파일이 환경변수 누락을 가려 버린다(deploy-spec 1-1).
    # 비밀 파일 위치는 프로젝트 루트의 config/application-secret.yml (작업 디렉터리 기준 자동 로드).
    default: local
    group:
      local: secret     # 아무 프로파일도 지정하지 않은 로컬 실행
      test: secret      # ./gradlew test (build.gradle이 test 프로파일 고정)
      # prod에는 secret을 묶지 않는다 — 운영은 환경변수만 쓴다(application-prod.yml)

  mail:
    # username/password(Gmail 앱 비밀번호)는 application-secret.yml에 둔다
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # ⚠️ 타임아웃은 선택이 아니라 필수다 (S-9 F-2).
          # 메일 발송을 트랜잭션 안에서 하므로, SMTP가 응답하지 않으면 그동안
          # DB 커넥션이 그대로 묶인다. 상한을 두지 않으면 메일 서버 장애가
          # 커넥션 풀 고갈로 번진다.
          connectiontimeout: 3000
          timeout: 5000
          writetimeout: 5000


management:
  health:
    mail:
      # 메일 헬스 인디케이터는 /actuator/health 호출마다 SMTP에 접속한다. Gmail 일시 장애가 앱 DOWN으로
      # 번지면 CI가 정상 배포를 롤백하고 업타임 모니터가 오경보를 낸다 — 메일은 앱 생존과 무관하다(deploy-spec 1-3).
      enabled: false


jwt:
  # secret은 config/application-secret.yml에 둔다 (.gitignore 대상)
  # TTL은 Duration(ISO-8601)으로 받아 오타 시 기동 시점에 실패하도록 한다
  access-token-ttl: PT30M      # 30분
  refresh-token-ttl: P14D      # 14일
  # 회전 직후 동시 재발급 요청을 재사용(탈취)으로 오판하지 않기 위한 유예 시간
  refresh-reuse-grace: PT30S


oauth:
  kakao:
    issuer: https://kauth.kakao.com
    jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
    # kid 캐시 미스 시 재조회하되 이 간격보다 자주는 하지 않는다.
    # 없으면 임의 kid 토큰을 반복 전송해 JWKS 조회를 무한 유발할 수 있고,
    # 카카오가 우리를 차단하면 소셜 로그인 전체가 죽는다.
    jwk-refresh-cooldown: PT1M
    # allowed-audiences는 application-secret.yml에 둔다 (앱 식별자라 커밋하지 않는다)

auth:
  oauth:
    # 소셜 로그인 nonce 유효 기간. 로그인 흐름(nonce 발급 → 카카오 SDK → 서버 검증)이
    # 이 안에 끝나야 한다. 짧을수록 재전송 창이 좁지만 사용자가 로그인 중 머뭇거릴 여지도 준다.
    nonce-ttl: PT5M
  password-reset:
    # 재설정 링크 유효 기간. 메일함이 털린 상황을 가정해 짧게 잡는다.
    ttl: PT30M
    # 마지막 발급 이후 이 시간 안의 재요청은 조용히 무시한다(응답은 그대로 200).
    # rate limiting이 없는 상태에서 메일 폭탄을 막는 최소 장치다 — S-9 F-1.
    resend-cooldown: PT3M


mail:
  password-reset:
    # 발신 주소. Gmail은 계정 주소와 다른 값을 넣어도 실제 발신자로 덮어쓴다.
    from: cinemory.noreply@gmail.com
    subject: "[CineMory] 비밀번호 재설정 안내"
    # 커스텀 스킴 딥링크. 웹 폴백 페이지가 없어 유니버설 링크를 쓸 수 없고,
    # 앱이 설치돼 있지 않으면 링크가 동작하지 않는다(한계로 명시).
    deep-link-base: cinemory://reset-password


# TMDB API
# access-token은 저장소에 커밋하지 않는다 — application-secret.yml에 tmdb.access-token으로 둔다.
# v4 Read Access Token(Bearer)이며 v3 api_key와 다른 값이다.
# 미설정 시 Authorization 헤더를 붙이지 않고, 기동은 막지 않는다(KOFIC과 동일 원칙).
tmdb:
  base-url: https://api.themoviedb.org/3

# KOFIC(영화진흥위원회) KOBIS Open API
# api-key만 비밀이다(application-secret.yml / 운영 환경변수). base-url은 공개 주소라 여기에 둔다 —
# 비밀 파일에만 있으면 prod(환경변수 전용)에서 누락된다.
kofic:
  base-url: https://www.kobis.or.kr/kobisopenapi/webservice/rest

cinemory:
  cors:
    # RN 네이티브는 CORS와 무관하지만 Expo 웹/브라우저 테스트에는 필요하다.
    # 8081 = Metro(SDK 50+ 웹 포함), 19006 = 구버전 Expo 웹
    allowed-origins: http://localhost:8081,http://localhost:19006
  boxoffice:
    # 일별 수집: KOFIC이 전일 데이터를 익일 제공하므로 새벽 5시에 '어제' 기준으로 수집
    daily-sync-cron: "0 0 5 * * *"
    # 재매칭: 일별 수집 직후 실행
    rematch-cron: "0 30 5 * * *"
    rematch-limit: 200
  theater:
    default-radius-meters: 5000
    max-radius-meters: 50000
    max-result-size: 50
  movie:
    seed:
      # 박스오피스 역방향 시드: 편당 왕복 2회(search+detail) — 6-5 rate limit 절 참고
      box-office-default-limit: 100
      # discover 시드: 페이지당 왕복 21회(discover 1 + 상세 20)
      discover-default-pages: 5
      # resync: 편당 왕복 1회(상세 조회만, existsByTmdbId 필터 없음) — 6-9
      resync-default-limit: 200
    random:
      # 홈 화면 배경(포스터 그리드)용 랜덤 표본 — 5-2 참고
      default-size: 20
      max-size: 50