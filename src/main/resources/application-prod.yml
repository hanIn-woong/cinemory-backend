# 운영 프로파일. 5-0-G / security-spec.md L-12 — Springdoc 문서 엔드포인트를 운영에서 닫는다.
# permitAll인 /v3/api-docs·/swagger-ui/**는 인가로는 막히지 않으므로, 여기서 자체를 꺼야 한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── 비밀 (deploy-spec 1-1 / security-spec L-10) ─────────────────────────────
# 운영은 환경변수만 쓴다(/etc/cinemory/cinemory.env). prod는 secret 프로파일 그룹에 묶이지 않는다.
# ⚠️ 기본값(${X:default})을 두지 않는다 — 누락 시 "플레이스홀더 X를 해석할 수 없다"로 기동이 실패해야 한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  # ── 운영 보강 (deploy-spec 1-3) — base의 로컬 개발용 SQL 로그를 끈다 ──────────
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  address: 127.0.0.1                  # Nginx만 접근. 외부에서 8080 직접 접근 차단(보안 그룹과 이중)
  forward-headers-strategy: native    # Nginx의 X-Forwarded-* 를 신뢰 — 요청 스킴이 https로 인식된다
  shutdown: graceful                  # 배포 재시작 시 처리 중 요청을 마무리

management:
  endpoints:
    web:
      exposure:
        include: health               # health만 노출
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

jwt:
  # 운영 값은 새로 발급한다(openssl rand -base64 64). 로컬 값 재사용 금지.
  secret: ${JWT_SECRET}

# tmdb/kofic은 로컬에선 "미설정 시 건너뜀"이지만, 운영에선 박스오피스 수집·온디맨드 동기화가 필수라 필수로 취급한다.
tmdb:
  access-token: ${TMDB_ACCESS_TOKEN}

kofic:
  api-key: ${KOFIC_API_KEY}

# 임베딩 호출(M3-b). 없으면 자연어 추천이 대체 결과로만 나오고 임베딩 배치가 매일 실패하므로 필수로 취급한다.
gemini:
  api-key: ${GEMINI_API_KEY}

mail:
  password-reset:
    from: ${MAIL_FROM}
    # https 링크 → Android App Link로 앱이 열리고, 안 되면 Nginx의 안내 페이지(security-spec S-10 R-1, deploy-spec 2-6-A).
    # 도메인은 비밀이 아니라 환경변수가 아니라 여기에 둔다. 빠뜨리면 base의 커스텀 스킴이 운영 메일에 나간다 — 아래 https-properties가 막는다.
    link-base: https://api.cinemory.co.kr/reset-password

oauth:
  kakao:
    # 쉼표 구분 → List<String> 바인딩. ⚠️ 운영은 네이티브 앱 키 하나만(REST API 키는 런북 웹 플로우 전용).
    allowed-audiences: ${KAKAO_ALLOWED_AUDIENCES}
  google:
    # 웹 클라이언트 ID 하나 — Android 토큰도 aud는 웹 클라이언트 ID다(account-integrity D-5-C)
    allowed-audiences: ${GOOGLE_ALLOWED_AUDIENCES}

# ── 운영 기동 가드 ProdStartupGuard (deploy-spec 1-2 B / security-spec L-10·L-11) ──
cinemory:
  # JVM 기본 시간대가 이 값과 다르면 기동 실패. systemd 유닛의 -Duser.timezone과 짝을 이룬다.
  required-time-zone: Asia/Seoul
  recommend:
    embedding-sync:
      # 운영은 17:10 KST. Gemini 무료 tier의 일일 한도가 태평양 시간 자정(KST 16:00, 11/2부터 17:00)에 초기화되므로
      # 초기화 직후에 돌려야 한다 — 06:00이면 한도 구간 한가운데에서 배치가 한도를 다 써 오후까지 자연어 검색이 degraded가 된다.
      # 적재가 끝나면 06:00으로 되돌려도 된다(변경분이 적다). 환경변수로 덮으려면 CINEMORY_RECOMMEND_EMBEDDINGSYNC_CRON.
      cron: "0 10 17 * * *"
  startup-check:
    # 비밀·필수 설정 목록. 위의 플레이스홀더와 같은 파일에 둔다 — 비밀이 늘면(예: M3-b 임베딩 API 키)
    # 플레이스홀더와 이 목록을 한 파일에서 함께 고친다.
    # @ConfigurationProperties는 미해석 ${X}를 리터럴로 넣고 넘어가므로, 누락은 이 목록으로만 잡힌다.
    required-properties:
      - spring.datasource.url
      - spring.datasource.username
      - spring.datasource.password
      - jwt.secret
      - tmdb.access-token
      - kofic.api-key
      - gemini.api-key
      - spring.mail.username
      - spring.mail.password
      - mail.password-reset.from
      - oauth.kakao.allowed-audiences
      - oauth.google.allowed-audiences
    # 값이 https://로 시작해야 하는 설정(security-spec S-10 R-1b). 존재 검사만으로는 base의 기본값(커스텀 스킴)이
    # 통과해 버린다 — 운영 메일 링크가 조용히 눌리지 않는 링크가 되는 유형이라 기동에서 막는다.
    https-properties:
      - mail.password-reset.link-base
