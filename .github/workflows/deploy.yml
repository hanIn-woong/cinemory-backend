# 운영 배포 (deploy-spec 8절 Phase 4 · P4-1 B안: SSM + OIDC)
# main push = 배포(GitHub Flow). 테스트는 1단계에서 머지 전 로컬 ./gradlew test가 관문이다 — 여기서는 돌리지 않는다.
# 흐름: 빌드 → 배포 직전 EBS 스냅샷 → S3 업로드 → SSM으로 서버의 cinemory-deploy.sh 실행(교체·헬스·자동 복구) → 외부 헬스 확인 → 오래된 CI 스냅샷 정리
#
# ⚠️ job에 environment:를 붙이지 않는다 — OIDC 토큰의 sub가 "...:environment:이름"으로 바뀌어
#    배포 역할의 신뢰 정책(repo:hanIn-woong/cinemory-backend:ref:refs/heads/main)과 어긋난다.
name: deploy

on:
  push:
    branches: [main]
    # 문서만 바뀐 push는 배포하지 않는다 — 재시작(약 20초 다운타임)과 CI 스냅샷이 문서 커밋마다 생기고,
    # 스냅샷 5개 유지(P4-1c)에서 실제 배포 직전 복원 지점이 문서 커밋에 밀려난다. 코드와 함께 바뀌면 그대로 배포된다.
    # 문서만 바꾼 뒤 재배포가 필요하면 Run workflow.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:      # 재배포용. 신뢰 정책상 main에서만 성공한다

# 두 배포가 겹치면 app.jar.prev를 서로 덮는다. 진행 중인 배포는 취소하지 않고 다음 것을 기다리게 한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write         # OIDC 토큰 발급
  contents: read

env:
  AWS_REGION: ap-northeast-2
  HEALTH_URL: https://api.cinemory.co.kr/actuator/health
  KEEP_SNAPSHOTS: 5       # P4-1c

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build jar
        run: |
          chmod +x gradlew    # 리포의 gradlew에 실행 비트가 없다(Windows에서 커밋)
          ./gradlew bootJar -x test --no-daemon
          JAR=$(ls build/libs/*.jar | grep -v -- '-plain\.jar$')
          [ "$(echo "$JAR" | wc -l)" -eq 1 ] || { echo "jar가 하나가 아닙니다: $JAR"; exit 1; }
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 생성 시점의 상태로 고정되므로 완료(completed)를 기다리지 않는다. 복원 지점은 마이그레이션이 돌기 전 DB다(D-3 조건 4).
      - name: Pre-deploy EBS snapshot
        run: |
          SNAP=$(aws ec2 create-snapshot \
            --volume-id "${{ vars.VOLUME_ID }}" \
            --description "pre-deploy ${GITHUB_SHA::7}" \
            --tag-specifications "ResourceType=snapshot,Tags=[{Key=Name,Value=cinemory-pre-deploy-${GITHUB_SHA::7}},{Key=cinemory:purpose,Value=pre-deploy},{Key=cinemory:commit,Value=${GITHUB_SHA}}]" \
            --query SnapshotId --output text)
          echo "스냅샷: $SNAP"
          echo "- 배포 직전 스냅샷: \`$SNAP\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        run: |
          PREFIX="s3://${{ vars.ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}"
          aws s3 cp --only-show-errors "$JAR" "$PREFIX/app.jar"
          aws s3 cp --only-show-errors deploy/scripts/cinemory-deploy.sh "$PREFIX/cinemory-deploy.sh"
          echo "PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Deploy via SSM
        run: |
          jq -n --arg p "$PREFIX" '{commands: [
            "/snap/bin/aws s3 cp --only-show-errors \($p)/cinemory-deploy.sh /tmp/cinemory-deploy.sh && bash /tmp/cinemory-deploy.sh \($p)/app.jar"
          ], executionTimeout: ["600"]}' > ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://ssm-params.json \
            --query Command.CommandId --output text)
          echo "SSM 명령: $CMD_ID"

          # aws ssm wait는 최대 100초라 기동 + 복구 시간(최대 약 6분)보다 짧다 — 직접 폴링한다
          STATUS=Pending
          for _ in $(seq 1 130); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)   # 발송 직후엔 InvocationDoesNotExist
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query '[ResponseCode, StandardOutputContent, StandardErrorContent]' --output text || true

          echo "- 서버 스크립트: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != Success ]; then
            echo "::error::서버 배포 실패($STATUS). 종료 코드 2 = 이전 jar로 자동 복구됨, 3 = 복구도 실패(런북 13절)"
            exit 1
          fi

      # 서버 안 헬스(127.0.0.1)가 UP이어도 Nginx·인증서 경로가 깨졌을 수 있다
      - name: External health check
        run: |
          for i in $(seq 1 6); do
            BODY=$(curl -fsS --max-time 10 "$HEALTH_URL" || true)
            case "$BODY" in *'"status":"UP"'*) echo "UP"; echo "- 외부 헬스: UP" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;; esac
            echo "시도 $i: ${BODY:-응답 없음}"; sleep 10
          done
          echo "::error::$HEALTH_URL 이 UP이 아닙니다 — 앱은 서버 안에서 UP이었으므로 Nginx·인증서·DNS를 본다"
          exit 1

      # P4-1c — CI 스냅샷(태그 cinemory:purpose=pre-deploy)만 최근 KEEP_SNAPSHOTS개 남긴다. 수동 스냅샷은 태그가 없어 대상이 아니다.
      - name: Prune old pre-deploy snapshots
        run: |
          OLD=$(aws ec2 describe-snapshots --owner-ids self \
            --filters Name=tag:cinemory:purpose,Values=pre-deploy Name=volume-id,Values="${{ vars.VOLUME_ID }}" \
            --query "reverse(sort_by(Snapshots,&StartTime))[${KEEP_SNAPSHOTS}:].SnapshotId" --output text)
          for s in $OLD; do
            echo "삭제: $s"
            aws ec2 delete-snapshot --snapshot-id "$s"
          done
