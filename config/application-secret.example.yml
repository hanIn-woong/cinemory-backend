# ⚠️ 이 파일은 커밋된다 — 실제 비밀을 절대 넣지 않는다. 값은 전부 가짜(ci-fake-…)다.
#
# 용도 (deploy-spec 8절 P4-2a)
#  1) CI(test.yml)가 config/application-secret.yml로 복사해 테스트 프로파일 기동에 쓴다.
#  2) "필요한 비밀 키 목록" 문서 — 로컬 config/application-secret.yml은 이 키를 모두 실제 값으로 채운다.
#     비밀 키를 추가하면 여기에도 가짜 값을 추가할 것. 안 하면 CI 테스트가 기동부터 실패한다.
#
# 가짜 값도 기동 검증은 통과해야 한다: jwt.secret 32바이트 이상(JwtProperties), allowed-audiences 1개 이상(KakaoOAuthProperties · GoogleOAuthProperties).
# 외부 API(TMDB·KOFIC·메일)는 테스트에서 실제로 호출하지 않는다 — 호출하면 가짜 값이라 401로 실패해 드러난다.

tmdb:
  access-token: ci-fake-tmdb-access-token

kofic:
  api-key: ci-fake-kofic-api-key

spring:
  datasource:
    password: ci-fake-root-password   # test.yml의 MYSQL_ROOT_PASSWORD와 같아야 한다
  mail:
    username: ci-fake@example.com
    password: ci-fake-mail-password

mail:
  password-reset:
    from: ci-fake@example.com

jwt:
  secret: ci-fake-jwt-secret-not-for-production-0123456789

oauth:
  kakao:
    allowed-audiences:
      - ci-fake-kakao-audience
  google:
    allowed-audiences:
      - ci-fake-google-audience.apps.googleusercontent.com
